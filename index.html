    <script>
      // Guard against third-party browser extension conflicts (e.g. EVM wallet extensions redefining window.ethereum)
      try {
        if (!('ethereum' in window)) {
          let _ethereum;
          Object.defineProperty(window, 'ethereum', {
            get() { return _ethereum; },
            set(val) { _ethereum = val; },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {}

      window.addEventListener(
        'error',
        function (event) {
          const isExtension =
            (event.filename && (event.filename.includes('chrome-extension://') || event.filename.includes('moz-extension://'))) ||
            (event.message && (event.message.includes('Cannot redefine property') || event.message.includes('ethereum')));
          if (isExtension) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );

      window.addEventListener(
        'unhandledrejection',
        function (event) {
          const reasonStr = String(event.reason || '');
          if (reasonStr.includes('ethereum') || reasonStr.includes('chrome-extension://') || reasonStr.includes('Cannot redefine property')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
